version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: campusconnect_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  celery:
    build: .
    container_name: campusconnect_celery
    command: celery -A campusconnect worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
